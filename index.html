<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS Wallet - Controle Financeiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Sidebar Navigation Menu */
    .menu-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2000;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      z-index: 2001;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .menu-item:hover, .menu-item.active {
      background-color: #2563eb;
      color: #ffffff;
    }

    .menu-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 10px;
      background-color: #1e293b;
      border: 1px solid #334155;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      position: relative;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .wallet-icon {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background-color: #0f172a;
      color: #38bdf8;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 6px;
      border: 1px solid #38bdf8;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Main Balance Card */
    .balance-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .balance-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .balance-amount {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 8px 0;
      color: #ffffff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #94a3b8;
      border-radius: 50%;
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
    }

    .summary-card .label {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .summary-card .value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .value.income { color: #4ade80; }
    .value.expense { color: #f87171; }

    /* Categories Section */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 10px 0;
    }

    /* Transactions */
    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .tx-info {
      display: flex;
      flex-direction: column;
    }

    .tx-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .tx-date {
      font-size: 0.75rem;
      color: #64748b;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 50%;
      transform: translateX(50%);
      width: calc(100% - 40px);
      max-width: 440px;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
      transition: background 0.2s;
    }

    .fab:hover {
      background-color: #1d4ed8;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal {
      background-color: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      border-top: 1px solid #334155;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Lateral Menu Overlay & Drawer -->
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-container">
          <svg class="wallet-icon" viewBox="0 0 24 24">
            <path d="M20 7H4C2.89543 7 2 7.89543 2 9V19C2 20.1046 2.89543 21 4 21H20C21.1046 21 22 20.1046 22 19V9C22 7.89543 21.1046 7 20 7Z"/>
            <path d="M16 14C16.5523 14 17 13.5523 17 13C17 12.4477 16.5523 12 16 12C15.4477 12 15 12.4477 15 13C15 13.5523 15.4477 14 16 14Z"/>
            <path d="M4 7V5C4 3.89543 4.89543 3 6 3H17"/>
          </svg>
          <span class="logo-badge">FS</span>
        </div>
        <div class="brand-title">FS Wallet</div>
      </div>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>

    <nav class="sidebar-menu">
      <a class="menu-item active" onclick="toggleMenu()">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Início (Dashboard)
      </a>
      <a class="menu-item" onclick="alert('Área de Extrato em breve!'); toggleMenu()">
        <svg viewBox="0 0 24 24"><path d="M4 14h4v7H4zm6-5h4v12h-4zm6-4h4v16h-4z"/></svg>
        Extrato Completo
      </a>
      <a class="menu-item" onclick="alert('Área de Categorias em breve!'); toggleMenu()">
        <svg viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11zM12 22a4 4 0 100-8 4 4 0 000 8zM5 14h5v5H5z"/></svg>
        Categorias
      </a>
      <a class="menu-item" onclick="alert('Metas Financeiras em breve!'); toggleMenu()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm5 12H7v-1c0-1.67 3.33-2.5 5-2.5s5 .83 5 2.5v1z"/></svg>
        Metas & Limites
      </a>
      <a class="menu-item" onclick="alert('Configurações em breve!'); toggleMenu()">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Configurações
      </a>
    </nav>
  </div>

  <div class="app-container">
    <!-- Top Header -->
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleMenu()" title="Abrir Menu">
        <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>

      <div class="brand">
        <div class="logo-container">
          <svg class="wallet-icon" viewBox="0 0 24 24">
            <path d="M20 7H4C2.89543 7 2 7.89543 2 9V19C2 20.1046 2.89543 21 4 21H20C21.1046 21 22 20.1046 22 19V9C22 7.89543 21.1046 7 20 7Z"/>
            <path d="M16 14C16.5523 14 17 13.5523 17 13C17 12.4477 16.5523 12 16 12C15.4477 12 15 12.4477 15 13C15 13.5523 15.4477 14 16 14Z"/>
            <path d="M4 7V5C4 3.89543 4.89543 3 6 3H17"/>
          </svg>
          <span class="logo-badge">FS</span>
        </div>
        <div class="brand-title">FS Wallet</div>
      </div>
      <div style="width: 40px;"></div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
      <div class="balance-label">Saldo do Mês</div>
      <div class="balance-amount" id="net-balance">R$ 0,00</div>
      <div class="status-badge" id="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Aguardando Lançamentos</span>
      </div>
    </div>

    <!-- Income / Expenses -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">Entradas</div>
        <div class="value income" id="total-income">R$ 0,00</div>
      </div>
      <div class="summary-card">
        <div class="label">Saídas</div>
        <div class="value expense" id="total-expense">R$ 0,00</div>
      </div>
    </div>

    <!-- Recent Transactions -->
    <div style="margin-bottom: 80px;">
      <div class="section-title">Últimos Lançamentos</div>
      <div class="card transaction-list" id="tx-list">
        <div class="empty-state" id="empty-state">Nenhum lançamento adicionado ainda.</div>
      </div>
    </div>

    <!-- FAB Button -->
    <button class="fab" onclick="openModal()">+ Novo Lançamento</button>
  </div>

  <!-- Modal Form -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Adicionar Gasto / Receita</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="tx-form" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>Tipo</label>
          <select id="type">
            <option value="income">Entrada (Receita / Salário)</option>
            <option value="expense">Saída (Gasto)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="desc" placeholder="Ex: Salário, Supermercado..." required>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" step="0.01" id="amount" placeholder="0,00" required>
        </div>
        <button type="submit" class="btn-submit">Salvar Lançamento</button>
      </form>
    </div>
  </div>

  <script>
    let income = 0.00;
    let expense = 0.00;

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('menu-overlay');
      
      if (sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
        overlay.style.display = 'none';
      } else {
        sidebar.classList.add('open');
        overlay.style.display = 'block';
      }
    }

    function openModal() {
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);

      if (type === 'income') {
        income += amount;
      } else {
        expense += amount;
      }

      updateValues();
      addTransactionToList(desc, amount, type);
      closeModal();
      document.getElementById('tx-form').reset();
    }

    function updateValues() {
      const net = income - expense;
      document.getElementById('total-income').innerText = `R$ ${income.toFixed(2)}`;
      document.getElementById('total-expense').innerText = `R$ ${expense.toFixed(2)}`;
      document.getElementById('net-balance').innerText = `R$ ${net.toFixed(2)}`;

      const badge = document.getElementById('status-badge');
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      if (net > 0) {
        badge.style.backgroundColor = 'rgba(34, 197, 94, 0.15)';
        badge.style.color = '#4ade80';
        dot.style.backgroundColor = '#22c55e';
        text.innerText = 'Saldo Positivo';
      } else if (net < 0) {
        badge.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
        badge.style.color = '#f87171';
        dot.style.backgroundColor = '#ef4444';
        text.innerText = 'Atenção ao Saldo';
      } else {
        badge.style.backgroundColor = 'rgba(148, 163, 184, 0.15)';
        badge.style.color = '#94a3b8';
        dot.style.backgroundColor = '#94a3b8';
        text.innerText = 'Saldo Zerado';
      }
    }

    function addTransactionToList(desc, amount, type) {
      const list = document.getElementById('tx-list');
      const emptyState = document.getElementById('empty-state');
      if (emptyState) {
        emptyState.remove();
      }

      const item = document.createElement('div');
      item.className = 'transaction-item';
      
      const isIncome = type === 'income';
      const sign = isIncome ? '+' : '-';
      const cssClass = isIncome ? 'income' : 'expense';

      item.innerHTML = `
        <div class="tx-info">
          <span class="tx-title">${desc}</span>
          <span class="tx-date">Hoje</span>
        </div>
        <span class="tx-amount ${cssClass}">${sign} R$ ${amount.toFixed(2)}</span>
      `;
      list.prepend(item);
    }
  </script>
</body>
</html>
